name: Build and Deploy to Dev

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (optional, defaults to commit SHA)'
        required: false
        type: string

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

permissions:
  id-token: write  
  contents: read  

jobs:
  build-and-push:
    name: Build ARM64 Image and Push to ECR
    runs-on: ubuntu-latest
    
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi
          
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${ECR_REPOSITORY}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${IMAGE_TAG}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false  # Disable provenance for cleaner multi-arch

      - name: Image push summary
        run: |
          echo "### 🚀 Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.meta.outputs.image_uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.meta.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "EventBridge will trigger blue-green deployment automatically..." >> $GITHUB_STEP_SUMMARY

  deployment-status:
    name: Monitor Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Monitor-${{ github.run_id }}

      - name: Wait for deployment to start
        run: |
          echo "⏳ Waiting 30 seconds for EventBridge to trigger deployment..."
          sleep 30

      - name: Check Lambda logs
        continue-on-error: true
        run: |
          FUNCTION_NAME="i-one-backend-dev-deployer"
          
          echo "Checking recent Lambda invocations..."
          aws logs tail "/aws/lambda/${FUNCTION_NAME}" \
            --since 5m \
            --format short \
            --follow --max-items 50 &
          
          TAIL_PID=$!
          sleep 60
          kill $TAIL_PID 2>/dev/null || true
          
          echo "✅ Deployment logs retrieved"

      - name: Deployment notification
        run: |
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The blue-green deployment is being handled by:" >> $GITHUB_STEP_SUMMARY
          echo "1. **EventBridge** - Detected ECR push event" >> $GITHUB_STEP_SUMMARY
          echo "2. **Lambda** - Orchestrating deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. **SSM** - Executing blue-green swap on EC2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check EC2 instance logs at: \`/var/log/deployment-*.log\`" >> $GITHUB_STEP_SUMMARY
